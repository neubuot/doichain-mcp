name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check that tag, server.json, pyproject.toml and package agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          json=$(jq -r .version server.json)
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('doichain_mcp/__init__.py').read()).group(1))")
          server=$(python3 -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('doichain_mcp/server.py').read(), re.M).group(1))")
          echo "tag=$tag server.json=$json pyproject=$project package=$package server.py=$server"
          test "$tag" = "$json" && test "$tag" = "$project" && test "$tag" = "$package" && test "$tag" = "$server"

      - name: Install mcp-publisher ${{ env.MCP_PUBLISHER_VERSION }}
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | grep ' mcp-publisher_linux_amd64.tar.gz$' | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Show registry entry
        continue-on-error: true
        run: curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.neubuot/doichain" | jq .
