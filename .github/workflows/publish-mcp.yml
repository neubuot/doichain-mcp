name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  # Manual run from main for a single entry, for example a new entry whose version already has a tag.
  workflow_dispatch:
    inputs:
      entry:
        description: Registry entry to publish
        required: true
        type: choice
        options: [verifile, doichain]

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that tag, both server.json files, pyproject.toml and package agree
        run: |
          json=$(jq -r .version server.json)
          verifile=$(jq -r .version server.verifile.json)
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('doichain_mcp/__init__.py').read()).group(1))")
          server=$(python3 -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('doichain_mcp/server.py').read(), re.M).group(1))")
          # A tag sets the expected version. A manual run has no tag and checks the files against the package.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$package"; fi
          echo "expected=$tag server.json=$json server.verifile.json=$verifile pyproject=$project package=$package server.py=$server"
          test "$tag" = "$json" && test "$tag" = "$verifile" && test "$tag" = "$project" && test "$tag" = "$package" && test "$tag" = "$server"

      - name: Install mcp-publisher ${{ env.MCP_PUBLISHER_VERSION }}
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | grep ' mcp-publisher_linux_amd64.tar.gz$' | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate server.json and server.verifile.json
        run: |
          ./mcp-publisher validate
          ./mcp-publisher validate server.verifile.json

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish the Doichain entry
        if: github.event_name == 'push' || inputs.entry == 'doichain'
        run: ./mcp-publisher publish

      - name: Publish the Verifile entry
        if: github.event_name == 'push' || inputs.entry == 'verifile'
        run: ./mcp-publisher publish server.verifile.json

      - name: Show registry entries
        continue-on-error: true
        run: |
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.neubuot/doichain" | jq .
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.neubuot/verifile" | jq .
