# nginx snippet for the Doichain MCP server. Put the first block into the http context (for example at the top
# of your site file), the locations into the server block that terminates TLS for your hostname.

limit_req_zone $binary_remote_addr zone=doimcp:10m rate=10r/s;
# Browsers (GET with text/html) get the landing page at /mcp, MCP clients get the server.
map "$request_method:$http_accept" $mcp_browser {
    default 0;
    "~^GET:.*text/html" 1;
}

server {
    listen 443 ssl;
    server_name mcp.example.org;
    # ssl_certificate ... (for example via certbot --nginx)

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # the server reads the client IP from here
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Stateless Streamable HTTP with JSON responses. There is no SSE stream, so GET/HEAD get 405.
    location = /mcp {
        if ($mcp_browser) { rewrite ^ /mcp-site/index.html last; }
        error_page 405 = @mcp405;
        error_page 413 = @mcp413;
        error_page 429 = @mcp429;
        if ($request_method ~ ^(GET|HEAD)$) { return 405; }
        client_max_body_size 256k;
        limit_req zone=doimcp burst=40 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8081;
    }
    location @mcp405 {
        default_type application/json;
        add_header Allow "POST" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 405 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Method not allowed. MCP clients send POST requests to this address, browsers get the landing page"}}';
    }
    location @mcp413 {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Request too large, at most 256 KB per MCP request"}}';
    }
    location @mcp429 {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Rate limit reached, at most 10 requests per second per IP address. Please retry shortly"}}';
    }
    location = /mcp/ { return 308 /mcp; }
    location = /mcp/health {
        limit_req zone=doimcp burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081/health;
    }
    # Landing page (web/mcp-site), strict CSP without third-party sources
    location /mcp-site/ {
        alias /var/www/doichain-mcp-site/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
}
