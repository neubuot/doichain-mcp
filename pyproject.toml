[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "doichain-mcp"
version = "1.4.1"
description = "MCP server for the Doichain blockchain: proof of existence, names and chain data for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "DOI Labs AG" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "doichain", "blockchain", "proof-of-existence", "timestamping", "notary", "namecoin", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://doi-api.sendlabs.de/mcp"
Repository = "https://github.com/neubuot/doichain-mcp"
Changelog = "https://github.com/neubuot/doichain-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/neubuot/doichain-mcp/issues"

[project.scripts]
doichain-mcp = "doichain_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["doichain_mcp"]

[tool.ruff]
line-length = 210
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
